<!doctype html>
<html lang=en>
<head>
    <meta charset=UTF-8>
    <meta name=viewport content="width=device-width, initial-scale=1.0">
    <meta name=apple-mobile-web-app-capable content=yes>
    <meta name=mobile-web-app-capable content=yes>
    <link rel=icon href=data:,>
    <link rel=stylesheet href=openctrl.css>
    <script src=openctrl.js></script>
    <title>OpenCtrl Xbox</title>
    <style>
        body.view main.gamepad {
            grid-template-areas:
                "left-shoulder left-shoulder . right-shoulder right-shoulder"
                "left-stick . center . face"
                ". dpad center right-stick .";
        }
        @media (orientation: portrait) {
            body.view main.gamepad {
                grid-template-areas:
                    "left-shoulder right-shoulder"
                    "left-stick face"
                    "dpad right-stick"
                    "center center";
            }
        }
        .face .a { color: #4caf50; }
        .face .b { color: #f44336; }
        .face .x { color: #2196f3; }
        .face .y { color: #ffc107; }
        .xbox {
            width: min(12vmin, 64px);
            height: min(12vmin, 64px);
            border-radius: 50%;
        }
    </style>
</head>
<body class=view>
    <header>
        <a href=index.html>&larr; OpenCtrl</a>
        <strong>Xbox</strong>
        <span data-status>Ready</span>
    </header>
    <div class=landscape-hint>Rotate your device for the best layout.</div>
    <main class=gamepad>
        <div class=shoulder style="grid-area: left-shoulder">
            <div data-fader=z data-spring=-127>LT</div>
            <button data-button=6>LB</button>
        </div>
        <div class=shoulder style="grid-area: right-shoulder">
            <button data-button=7>RB</button>
            <div data-fader=rz data-spring=-127>RT</div>
        </div>
        <div style="grid-area: left-stick" data-stick="x y" data-stick-button=13></div>
        <div data-hatpad style="grid-area: dpad"></div>
        <div class=center style="grid-area: center">
            <button class=xbox data-button=12>Xbox</button>
            <div class=row>
                <button data-button=10>View</button>
                <button data-button=11>Menu</button>
            </div>
            <small>Double-tap a stick to click it</small>
        </div>
        <div class=face style="grid-area: face">
            <button class="top y" data-button=4>Y</button>
            <button class="left x" data-button=3>X</button>
            <button class="right b" data-button=1>B</button>
            <button class="bottom a" data-button=0>A</button>
        </div>
        <div style="grid-area: right-stick" data-stick="rx ry" data-stick-button=14></div>
    </main>
</body>
</html>
