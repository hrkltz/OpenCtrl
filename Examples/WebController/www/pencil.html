<!doctype html>
<html lang=en>
<head>
    <meta charset=UTF-8>
    <meta name=viewport content="width=device-width, initial-scale=1.0">
    <meta name=apple-mobile-web-app-capable content=yes>
    <meta name=mobile-web-app-capable content=yes>
    <link rel=icon href=data:,>
    <link rel=stylesheet href=openctrl.css>
    <script src=openctrl.js></script>
    <title>OpenCtrl Pencil</title>
    <style>
        main {
            flex-direction: column;
            align-items: stretch;
            gap: 8px;
        }
        canvas {
            flex: 1 1 auto;
            min-height: 0;
            width: 100%;
            border-radius: 8px;
            background-color: var(--surface);
        }
    </style>
</head>
<body class=view>
    <header>
        <a href=index.html>&larr; OpenCtrl</a>
        <strong>Pencil</strong>
        <span data-status>Ready</span>
    </header>
    <main>
        <canvas data-pen></canvas>
        <div class=row>
            <button data-pen-toggle=barrel>Barrel button</button>
            <button data-pen-toggle=eraser>Eraser</button>
            <button id=clear>Clear</button>
            <small>The surface maps to the whole host screen. Needs a host with HID pen support (Windows, Linux, ChromeOS, Android).</small>
        </div>
    </main>
    <script>
        // Draw the strokes locally as feedback, sized by pressure.
        const canvas = document.querySelector('canvas');
        const context = canvas.getContext('2d');
        let last = null;

        function resize() {
            canvas.width = canvas.clientWidth * devicePixelRatio;
            canvas.height = canvas.clientHeight * devicePixelRatio;
        }
        window.addEventListener('resize', resize);
        resize();

        canvas.addEventListener('pointermove', (event) => {
            if (!(event.buttons & 1)) {
                last = null;
                return;
            }
            const point = { x: event.offsetX * devicePixelRatio, y: event.offsetY * devicePixelRatio };
            if (last) {
                context.globalCompositeOperation = penToggles.eraser || (event.buttons & 32) ? 'destination-out' : 'source-over';
                context.strokeStyle = getComputedStyle(document.body).color;
                context.lineWidth = (1 + (event.pressure || 0.5) * 8) * devicePixelRatio;
                context.lineCap = 'round';
                context.beginPath();
                context.moveTo(last.x, last.y);
                context.lineTo(point.x, point.y);
                context.stroke();
            }
            last = point;
        });
        canvas.addEventListener('pointerup', () => last = null);
        document.getElementById('clear').addEventListener('click', () => context.clearRect(0, 0, canvas.width, canvas.height));
    </script>
</body>
</html>
